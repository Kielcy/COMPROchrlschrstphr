<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Styles</title>
    
    <!-- Navbar styles fragment -->
    <style th:fragment="navbar-styles">
        /* Navigation bar styling */
        .navbar {
            background-color: #1e1e1e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            height: 60px; /* Fixed height for consistency */
        }
        
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%; /* Take full height of navbar */
        }
        
        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .navbar-logo-icon {
            width: 30px;
            height: 30px;
            color: #c49b63;
        }
        
        .navbar-logo-text {
            color: #c49b63;
            font-size: 1.4rem;
            font-weight: 700;
        }
        
        .navbar-links {
            display: flex;
            align-items: center;
        }
        
        .navbar-link {
            padding: 0 15px;
            height: 60px;
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .navbar-link:hover {
            color: #c49b63;
            background-color: rgba(196, 155, 99, 0.1);
        }
        
        .navbar-link.active {
            color: #c49b63;
            border-bottom: 2px solid #c49b63;
            font-weight: 600;
        }
        
        .navbar-link-icon {
            width: 20px;
            height: 20px;
        }
        
        .navbar-logout {
            padding: 8px 16px;
            background-color: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 36px; /* Fixed height for consistency */
            width: auto; /* Auto width */
            justify-content: center;
        }
        
        .navbar-logout:hover {
            background-color: rgba(255, 107, 107, 0.2);
        }
        
        .navbar-logout-icon {
            width: 18px;
            height: 18px;
        }

        .navbar-mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        /* Custom header styling */
        .header {
            padding: 30px 0 10px;
            text-align: center;
        }
        
        .header-title {
            color: #c49b63;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .header-subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* Responsive navbar adjustments */
        @media (max-width: 768px) {
            .header-title {
                font-size: 1.8rem;
            }
            
            .header-subtitle {
                font-size: 0.9rem;
            }
            
            .navbar {
                height: auto;
                min-height: 60px;
            }
            
            .navbar-container {
                padding: 10px 20px;
                flex-wrap: wrap;
            }
            
            .navbar-links {
                position: fixed;
                top: 60px;
                left: -100%;
                flex-direction: column;
                background-color: #1e1e1e;
                width: 100%;
                text-align: center;
                transition: all 0.3s ease;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                align-items: stretch;
                z-index: 200;
            }
            
            .navbar-links.active {
                left: 0;
            }
            
            .navbar-link {
                height: auto;
                padding: 15px 20px;
                justify-content: center;
            }
            
            .navbar-link.active {
                border-bottom: none;
                background-color: rgba(196, 155, 99, 0.1);
            }
            
            .navbar-mobile-toggle {
                display: block;
            }
            
            .navbar-logout {
                margin: 15px auto;
                justify-content: center;
                width: 80%;
            }
        }
    </style>
    
    <!-- Common styles fragment -->
    <style th:fragment="common-styles">
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
            width: 100%;
        }
        
        /* Footer */
        .footer {
            background-color: #1a1a1a;
            padding: 20px 0;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
</body>
</html>
