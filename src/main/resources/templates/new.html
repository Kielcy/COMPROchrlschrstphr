<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Coffee</title>
    <style>
        body {
           font-family: Arial, sans-serif;
           margin: 20px;
           background-color: #121212;
           color: #e0e0e0;
           text-align: center; /* Center the content */
       }

       h1 {
           color: #c49b63;
           text-align: center;
       }

       form {
           max-width: 500px;
           margin: 0 auto;
           background-color: #1e1e1e;
           padding: 20px;
           border-radius: 10px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
       }

       label {
           display: block;
           margin: 10px 0;
       }

       input, select {
           width: 100%;
           padding: 8px;
           margin-top: 5px;
           background-color: #2c2c2c;
           border: 1px solid #3e2723;
           color: #e0e0e0; /* Input text */
           border-radius: 5px;
       }

       button {
           margin-top: 20px;
           padding: 10px 15px;
           background-color: #3e2723;
           color: #f5f5f5;
           border: none;
           border-radius: 5px;
           cursor: pointer;
           font-weight: bold;
       }

       button:hover {
           background-color: #5d4037;
       }

       a {
           text-decoration: none;
           color: #f5f5f5;
           font-weight: bold;
           display: inline-block;
           padding: 10px 15px;
           background-color: #3e2723;
           border-radius: 5px;
           margin-top: 20px;
       }

       a:hover {
           background-color: #5d4037;
           color: #ffcc80;
       }

       /* Center the Back to List link */
       .back-button-container {
           display: flex;
           justify-content: center; /* Center the link horizontally */
           margin-top: 20px;
       }


    </style>
</head>
<body>

<h1>Add New Coffee</h1>

<form action="/save" method="post">
    <label>Name: <input type="text" name="name" required></label>
    <label>Type: <input type="text" name="type" required></label>
    <label>Size: <input type="text" name="size" required></label>
    <label>Price: <input type="number" step="0.01" name="price" required></label>
    <label>Roast Level: <input type="text" name="roastLevel" required></label>
    <label>Origin: <input type="text" name="origin" required></label>
    <label>Decaf:
        <select name="isDecaf">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>
    </label>
    <label>Stock: <input type="number" name="stock" required></label>
    <label>Flavor Notes (comma-separated): <input type="text" name="flavorNotes"></label>
    <label>Brew Method: <input type="text" name="brewMethod" required></label>

    <button type="submit">Add Coffee</button>
</form>

<!-- Center the Back to List link -->
<div class="back-button-container">
    <a href="/">Back to List</a>
</div>

</body>
</html>
