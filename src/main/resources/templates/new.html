<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Coffee</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #121212; /* Dark background */
      color: #e0e0e0; /* Light text */
    }

    h1 {
      color: #c49b63; /* Warm coffee color */
      text-align: center;
    }

    form {
      max-width: 500px;
      margin: 0 auto;
      background-color: #1e1e1e; /* Form background */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7); /* Darker shadow */
    }

    label {
      display: block;
      margin: 10px 0;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      background-color: #2c2c2c; /* Input background */
      border: 1px solid #3e2723; /* Input border */
      color: #e0e0e0; /* Input text */
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #3e2723; /* Dark coffee brown */
      color: #f5f5f5; /* Light text */
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #5d4037; /* Slightly lighter brown */
    }

    a {
      text-decoration: none;
      color: #c49b63; /* Warm coffee color */
      font-weight: bold;
    }

    a:hover {
      color: #ffcc80; /* Lighter hover effect */
    }

  </style>
</head>
<body>

<h1>Add New Coffee</h1>

<form action="/save" method="post">
  <label>Name: <input type="text" name="name" required></label>
  <label>Type: <input type="text" name="type" required></label>
  <label>Size: <input type="text" name="size" required>   </label>
  <label>Price: <input type="number" step="0.01" name="price" required></label>
  <label>Roast Level: <input type="text" name="roastLevel" required></label>
  <label>Origin: <input type="text" name="origin" required></label>
  <label>Decaf:
    <select name="isDecaf">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <label>Stock: <input type="number" name="stock" required></label>
  <label>Flavor Notes (comma-separated): <input type="text" name="flavorNotes"></label>
  <label>Brew Method: <input type="text" name="brewMethod" required></label>

  <button type="submit">Add Coffee</button>
</form>

<a href="/">Back to List</a>

</body>
</html>
