<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coffee List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
        }
        h1 {
            color: #c49b63; /* Warm coffee color */
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7); /* Darker shadow */
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #3e2723; /* Dark coffee brown */
            color: #f5f5f5; /* Light text */
        }
        tr:nth-child(even) {
            background-color: #1e1e1e; /* Slightly lighter row */
        }
        tr:nth-child(odd) {
            background-color: #2c2c2c; /* Darker odd rows */
        }
        a {
            text-decoration: none;
            color: #c49b63; /* Warm coffee color */
            font-weight: bold;
        }
        a:hover {
            color: #ffcc80; /* Lighter hover effect */
        }
        .add-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #3e2723; /* Dark coffee brown */
            color: #f5f5f5; /* Light text */
            text-decoration: none;
            border-radius: 5px;
        }
        .add-button:hover {
            background-color: #5d4037; /* Slightly lighter brown */
        }
        .search-bar {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-bar input {
            padding: 10px;
            width: 50%;
            border: 1px solid #3e2723;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #f5f5f5;
        }
        .search-bar button {
            padding: 10px 20px;
            background-color: #c49b63;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .search-bar button:hover {
            background-color: #5d4037;
        }
    </style>
</head>
<body>
<h1>Available Coffees</h1>

<!-- Search Bar -->
<div class="search-bar">
    <form action="/" method="get">
        <input type="text" name="search" placeholder="Search coffees..." />
        <button type="submit">Search</button>
    </form>
</div>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Size</th>
        <th>Price</th>
        <th>Roast Level</th>
        <th>Origin</th>
        <th>Decaf</th>
        <th>Stock</th>
        <th>Flavor Notes</th>
        <th>Brew Method</th>
        <th>Actions</th>
        <th>Delete</th>
    </tr>
    <tr th:each="coffee : ${coffees}">
        <td th:text="${coffee.id}"></td>
        <td th:text="${coffee.name}"></td>
        <td th:text="${coffee.type}"></td>
        <td th:text="${coffee.size}"></td>
        <td th:text="${coffee.price}"></td>
        <td th:text="${coffee.roastLevel}"></td>
        <td th:text="${coffee.origin}"></td>
        <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
        <td th:text="${coffee.stock}"></td>
        <td th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></td>
        <td th:text="${coffee.brewMethod}"></td>
        <td>
            <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
        </td>
        <td>
            <a th:href="@{/delete(id=${coffee.id})}">Delete</a>
        </td>
    </tr>
</table>
<a href="/add" class="add-button">Add New Coffee</a>
</body>
</html>
