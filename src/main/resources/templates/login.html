<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Login</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
            line-height: 1.6;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" opacity="0.05"><path fill="%23c49b63" d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z" /></svg>');
            background-repeat: repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background-color: #1e1e1e; /* Form background */
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-title {
            color: #c49b63; /* Warm coffee color */
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .login-subtitle {
            color: #a0a0a0;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .coffee-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            display: block;
            color: #c49b63;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #c49b63;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #2c2c2c; /* Input background */
            border: 1px solid #3e2723; /* Input border */
            color: #e0e0e0; /* Input text */
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        input:focus {
            outline: none;
            border-color: #c49b63;
            box-shadow: 0 0 0 2px rgba(196, 155, 99, 0.3);
        }

        button {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 14px 20px;
            background-color: #3e2723; /* Dark coffee brown */
            color: #f5f5f5; /* Light text */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #5d4037; /* Slightly lighter brown */
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .alert-success {
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #a0a0a0;
            font-size: 0.8rem;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .login-container {
                width: 95%;
                padding: 1.5rem;
            }
            
            .login-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <svg class="coffee-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z" />
            </svg>
            <h1 class="login-title">Coffee Shop</h1>
            <p class="login-subtitle">Please sign in to continue</p>
        </div>

        <div th:if="${loginError}" class="alert alert-error" th:text="${loginError}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
        
        <form action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        
        <div class="login-footer">
            Default credentials: admin / coffee123
        </div>
    </div>
</body>
</html>
