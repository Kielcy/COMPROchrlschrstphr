<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Catalog</title>
    
    <!-- Include common styles -->
    <style th:replace="fragments/styles :: common-styles"></style>
    <style th:replace="fragments/styles :: navbar-styles"></style>
    
    <style>
        /* Catalog specific styles */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .coffee-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .coffee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        .coffee-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .coffee-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .coffee-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #c49b63;
            margin-bottom: 10px;
        }
        
        .coffee-details {
            flex-grow: 1;
            margin-bottom: 15px;
        }
        
        .coffee-detail {
            display: flex;
            margin-bottom: 8px;
        }
        
        .detail-label {
            font-weight: 500;
            width: 100px;
            color: #a0a0a0;
        }
        
        .detail-value {
            color: #e0e0e0;
        }
        
        .coffee-price {
            font-size: 1.3rem;
            font-weight: 600;
            color: #c49b63;
            margin-top: auto;
            margin-bottom: 15px;
        }
        
        .coffee-actions {
            display: flex;
            gap: 10px;
        }
        
        .card-action-link {
            flex: 1;
            padding: 10px;
            text-align: center;
            background-color: #3e2723;
            color: #f5f5f5;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .card-action-link:hover {
            background-color: #5d4037;
        }
        
        .coffee-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .badge {
            padding: 4px 8px;
            background-color: rgba(196, 155, 99, 0.2);
            color: #c49b63;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .catalog-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1 class="header-title">Coffee Catalog</h1>
    </header>

    <!-- Navigation Bar -->
    <div th:replace="fragments/navbar :: navbar('catalog')"></div>

    <div class="container">
        <!-- Coffee Catalog Grid -->
        <div class="catalog-grid">
            <div th:each="coffee : ${coffees}" class="coffee-card">
                <img th:src="@{'/uploads/' + ${coffee.imagePath}}" alt="Coffee Image" class="coffee-image" 
                     onerror="this.src='/uploads/default-coffee.jpg'; this.onerror=null;">
                
                <div class="coffee-info">
                    <h2 class="coffee-name" th:text="${coffee.name}">Coffee Name</h2>
                    
                    <div class="coffee-badges">
                        <span class="badge" th:text="${coffee.type}">Type</span>
                        <span class="badge" th:text="${coffee.roastLevel}">Roast Level</span>
                        <span class="badge" th:text="${coffee.brewMethod}">Brew Method</span>
                        <span class="badge" th:if="${coffee.decaf}">Decaf</span>
                    </div>
                    
                    <div class="coffee-details">
                        <div class="coffee-detail">
                            <span class="detail-label">Origin:</span>
                            <span class="detail-value" th:text="${coffee.origin}">Origin</span>
                        </div>
                        <div class="coffee-detail">
                            <span class="detail-label">Size:</span>
                            <span class="detail-value" th:text="${coffee.size}">Size</span>
                        </div>
                        <div class="coffee-detail">
                            <span class="detail-label">Stock:</span>
                            <span class="detail-value" th:text="${coffee.stock}">Stock</span>
                        </div>
                        <div class="coffee-detail">
                            <span class="detail-label">Flavors:</span>
                            <span class="detail-value" th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}">Flavors</span>
                        </div>
                    </div>
                    
                    <div class="coffee-price" th:text="'$' + ${#numbers.formatDecimal(coffee.price, 1, 2)}">$0.00</div>
                    
                    <div class="coffee-actions">
                        <a class="card-action-link" th:href="@{/edit(id=${coffee.id})}">Edit</a>
                        <form th:action="@{/delete}" method="post" style="flex:1; margin:0; padding:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="id" th:value="${coffee.id}" />
                            <button type="submit" class="card-action-link" style="width:100%; border:none; cursor:pointer; padding:10px; font:inherit;">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Include navbar JavaScript -->
    <div th:replace="fragments/navbar :: navbar-js"></div>
</body>
</html>
