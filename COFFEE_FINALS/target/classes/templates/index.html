<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coffee List</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<header class="header">
    <div class="header-container">
        <div class="logo">
            <h2>Coffee Management</h2>
        </div>
        <nav class="nav-links">
            <a href="/" class="active">Coffee List</a>
            <a href="/add">Add New</a>
        </nav>
    </div>
</header>

<div class="page-container">
    <div class="page-title">
        <h1>Available Coffees</h1>
        <p>Browse, search and manage your coffee inventory</p>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
        <form action="/" method="get" class="search-form">
            <input type="text" name="search" placeholder="Search coffees by name, type or origin..." />
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Size</th>
                        <th>Price</th>
                        <th>Roast Level</th>
                        <th>Origin</th>
                        <th>Decaf</th>
                        <th>Stock</th>
                        <th>Flavor Notes</th>
                        <th>Brew Method</th>
                        <th>Actions</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="coffee : ${coffees}">
                        <td th:text="${coffee.id}"></td>
                        <td th:text="${coffee.name}"></td>
                        <td th:text="${coffee.type}"></td>
                        <td th:text="${coffee.size}"></td>
                        <td th:text="'₱' + ${coffee.price}"></td>
                        <td th:text="${coffee.roastLevel}"></td>
                        <td th:text="${coffee.origin}"></td>
                        <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
                        <td th:text="${coffee.stock}"></td>
                        <td th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></td>
                        <td th:text="${coffee.brewMethod}"></td>
                        <td>
                            <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
                        </td>
                        <td>
                            <a th:href="@{/delete(id=${coffee.id})}">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Center the button -->
    <div class="button-container">
        <a href="/add" class="add-button">Add New Coffee</a>
    </div>
</div>

<footer class="footer">
    <p>© 2025 Coffee Management System</p>
</footer>

</body>
</html>
